<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spike PS2 3D · Matías</title>
<!--
  THROWAWAY PROTOTYPE. One file, no build. Serve with: python3 -m http.server (from spike/ps2-3d)

  OPTIONAL REAL MODELS (drop the files in spike/ps2-3d/assets/ and reload; no code changes needed):
    assets/ps2.glb   the console       -> used instead of the procedural console if the file exists
    assets/tv.glb    the TV (optional) -> used instead of the procedural TV if the file exists
  Both are normalized on load: Y-up, laid flat if it was exported standing, width along X, front facing +Z,
  centered, pivot at the bottom center, scaled to a real-world width (PS2 fat 30 cm, TV 72 cm in scene units).

  How parts are found (case-insensitive regex on node/mesh names; the first match wins; see MODEL_CFG below):
    ps2.glb:  tray   /tray|bandeja|drawer|disc.?door|lid/         (moves +Z when the tray opens)
              power  /power|pwr/        reset /reset/        eject /eject/
    tv.glb:   screen /screen|display|crt.?glass|pantalla|glass/   (gets the menu CanvasTexture; needs 0..1 UVs)
  If a name does not match: open the console (F12) and read the "[ps2.glb] nodes:" line, then either
    - add the real name to MODEL_CFG.ps2.names.<part> (regex source strings), or
    - set MODEL_CFG.ps2.manual.<part> = 'ExactNodeName'.
  If there is no tray node, the disc is inserted anyway with an approximate slide into the front slot, placed
  from the bounding box (MODEL_CFG.ps2.slot: x/y fractions of the box). Missing buttons get invisible hit zones
  at approximate spots (MODEL_CFG.ps2.zones).
  Quick tuning from the URL: ?ps2rot=90 (extra Y rotation in degrees), ?ps2glb=assets/other.glb, ?tvrot=90.
  Credits: edit CREDITS below (it is printed in the footer of both views).
-->
<style>
  :root { --panel-solid: #2f3c5a; --line: rgba(222,226,236,.28); --text: #e6e3dc; --soft: #c3cbd9; --focus: #e6e3dc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, #3a2112 0%, #2b1b13 50%, #2b1d17 100%);   /* warm browns: the room does not fill a portrait screen and cold navy read as a hole */
    color: var(--text); font-family: "Archivo","Helvetica Neue",Arial,sans-serif; overflow: hidden;
  }
  body.plain { overflow: auto; background: #4a5c7e; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; outline: none; }   /* horizontal drags are ours, vertical ones pass to the page */
  #gl.hover { cursor: pointer; }
  #certDlg { border: 1px solid var(--line); background: var(--panel-solid); color: var(--text); padding: 12px; width: min(960px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; }
  #certDlg::backdrop { background: rgba(10,14,22,.75); }
  #certDlg img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 150px); height: auto; margin: 0 auto; }
  #certDlg figcaption { margin: 10px 2px 2px; font-size: 14px; color: var(--muted, #b8c0d4); }
  #certClose { margin-top: 10px; min-height: 44px; padding: 0 18px; border: 1px solid var(--line); background: #3a4968; color: var(--text); font-weight: 600; }
  #certClose:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  body.plain #gl, body.plain .hud, body.plain .film { display: none; }


  /* guestbook form (a native <dialog>: focus trap, Esc and inert background come from the browser) */
  #gbDlg { border: 1px solid var(--line); background: var(--panel-solid); color: var(--text); padding: 0; width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; font: inherit; }
  #gbDlg::backdrop { background: rgba(10,14,22,.6); }
  #gbForm { padding: 22px 22px 20px; display: grid; gap: 14px; }
  #gbForm h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
  #gbForm p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--soft); }
  #gbForm label, #gbForm legend { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
  #gbForm input[type=text], #gbForm textarea { font: inherit; font-weight: 400; font-size: 16px; color: var(--text); background: rgba(10,14,22,.45); border: 1px solid var(--line); padding: 10px 12px; min-height: 44px; width: 100%; box-sizing: border-box; }
  #gbForm textarea { resize: vertical; min-height: 84px; }
  #gbForm :focus-visible, #gbDlg button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #gbForm fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
  .gbswatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .gbswatches label { display: block; position: relative; }
  .gbswatches input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .gbswatches input + span { display: block; width: 100%; height: 44px; background: var(--c); border: 2px solid rgba(255,255,255,.35); box-sizing: border-box; }
  .gbswatches input:checked + span { border-color: #fff; box-shadow: 0 0 0 2px var(--panel-solid), 0 0 0 4px #fff; }
  .gbswatches input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 4px; }
  .gbhp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  #gbCount { font-weight: 400; font-size: 12px; color: var(--soft); justify-self: end; }
  #gbErr { color: #ffb4a8; min-height: 1.2em; }
  #gbForm.done > p:first-of-type, #gbForm.done label, #gbForm.done fieldset, #gbForm.done #gbCancel { display: none; }
  #gbForm.done #gbErr { color: #bff0c8; font-size: 1.05em; }
  .gbbtns { display: flex; gap: 8px; justify-content: flex-end; }
  .gbbtns button, .gbopen { min-height: 44px; padding: 0 18px; border: 1px solid var(--line); background: #3a4968; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  .gbbtns button[type=submit] { background: #e6e3dc; color: #1c2436; }
  .gbbtns button:disabled { opacity: .6; cursor: default; }
  #plain .gbitem { list-style: none; margin: 0 0 10px; padding: 12px 16px; background: #fff7e6; border-radius: 8px; border: 1px solid var(--line); border-left: 6px solid var(--c); }
  #plain .gbitem p { margin: 4px 0 0; }
  #plain .gbitem time { margin-left: 10px; font-size: 13px; color: var(--soft); }
  #plain #gbList { padding: 0; }

  /* light film: grain + vignette, static (no animation, so nothing to turn off for reduced motion) */
  .film { display: none !important; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(6,9,14,.45) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    opacity: .5; }   /* no mix-blend-mode: blending a full-screen layer over a WebGL canvas costs a lot on real GPUs */

  .top { position: fixed; z-index: 20; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px clamp(16px,3vw,32px); pointer-events: none; }
  .brand { font-weight: 800; letter-spacing: -.02em; font-size: 20px; pointer-events: auto; }
  .topbtns { display: flex; gap: 8px; pointer-events: auto; }
  #plainBtn, #soundBtn { pointer-events: auto; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); background: var(--panel-solid); font-weight: 600; font-size: 14px; letter-spacing: .02em; }
  #plainBtn:hover, #soundBtn:hover { background: #3a4968; }
  @media (max-width: 760px) { #dbg { top: auto !important; bottom: 118px; } }
  #dbg { position: fixed; z-index: 40; left: 8px; top: 110px; max-width: min(420px, calc(100vw - 16px)); background: rgba(8,12,20,.88); border: 1px solid var(--line); padding: 8px 10px; font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #cfe3ff; }
  #dbg pre { margin: 0 0 6px; white-space: pre-wrap; max-height: 62vh; overflow: auto; }
  #dbg button { min-height: 32px; padding: 0 10px; margin-right: 6px; font-size: 12px; border: 1px solid var(--line); background: #2f3c5a; }
  .navarrow { position: fixed; z-index: 13; width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: rgba(36,48,72,.88); color: var(--text); font-size: 34px; line-height: 1; padding: 0 0 6px; display: grid; place-items: center; }
  .navarrow[hidden] { display: none; }
  .navarrow:disabled { opacity: .3; cursor: default; }
  .navarrow:not(:disabled):hover { background: #3d5384; }
  #soundBtn[aria-pressed=true] { background: #3d5384; }

  #hint { cursor: default; color: var(--text); }
  #hint.start { top: auto; bottom: 64px; cursor: pointer; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; padding: 12px 26px; min-height: 48px; pointer-events: auto; }
  #stepBack { position: fixed; z-index: 21; left: clamp(16px,3vw,32px); top: 58px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); background: var(--panel-solid); font-weight: 600; font-size: 14px; }
  #stepBack[hidden] { display: none; }
  body.warming #gl { opacity: 0; }
  #gl { transition: opacity .6s ease; }
  #hint {
    position: fixed; z-index: 12; left: 50%; bottom: 58px; transform: translateX(-50%); padding: 10px 18px; max-width: calc(100vw - 32px); text-align: center;
    background: rgba(36,48,72,.82); border: 1px solid var(--line); font-weight: 600; letter-spacing: .04em; font-size: 13px; pointer-events: none;
    animation: pulse 2.6s ease-in-out infinite;
  }
  #hint.calm { animation: none; opacity: .85; transition: opacity 1s ease; }
  #hint.calm.gone { opacity: 0; }
  @keyframes pulse { 50% { opacity: .55; } }
  #foot { position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; padding: 8px clamp(16px,3vw,32px); font-size: 11px; line-height: 1.4; color: var(--soft); background: linear-gradient(to top, rgba(10,13,19,.75), transparent); }
  #foot b { color: var(--text); }
  #foot a { color: var(--text); text-decoration: underline; }
  body.plain #foot { position: static; max-width: 760px; margin: 0 auto; padding: 0 20px 40px; background: none; }
  @media (min-width: 761px) { #hint { bottom: auto; top: 18px; } }   /* desktop: the hint goes to the top so it never covers the console */
  #foot summary { display: none; cursor: pointer; list-style: none; padding: 4px 0; }
  #foot summary::-webkit-details-marker { display: none; }
  @media (max-width: 760px) { #foot { font-size: 10px; line-height: 1.35; } #hint { bottom: 76px; }
    body:not(.plain) #foot summary { display: block; font-weight: 600; text-decoration: underline; }   /* 3D view on a phone: credits fold into one line so they never cover the hint button; the plain version always shows them */
    body:not(.plain) #foot details[open] { background: rgba(10,13,19,.92); margin: -8px calc(-1 * clamp(16px,3vw,32px)) 0; padding: 8px clamp(16px,3vw,32px); } }
  @media (prefers-reduced-motion: reduce) { #hint { animation: none; } }

  /* plain version: the room's palette (cream wall, wood, orange curtains, teal rug), Dosis headings */
  body.plain { height: auto; min-height: 100%; background: linear-gradient(180deg, #e9d2a8 0, #f1e2c2 340px) no-repeat #f1e2c2; }
  body.plain .brand { color: #2b2118; text-shadow: none; }
  #plain .gbopen { border: 0; border-radius: 10px; background: linear-gradient(180deg, #e8833f, #b4501f); color: #fff7e6; font: 700 18px "Dosis",sans-serif; letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 4px 12px rgba(90,50,20,.25); }
  #plain .gbopen:hover { filter: brightness(1.08); }
  #plain, body.plain #foot { --text: #2b2118; --soft: #6b5640; --line: rgba(43,33,24,.22); color: var(--text); }
  #plain { display: none; max-width: 860px; margin: 0 auto; padding: 96px 20px 40px; }
  body.plain #plain { display: block; }
  #plain h1, #plain h2, #plain h3 { font-family: "Dosis","Trebuchet MS",sans-serif; }
  #plain h1 { font-size: clamp(48px,10vw,88px); font-weight: 800; margin: 0; line-height: .95; letter-spacing: -.01em; color: #2b2118; }
  #plain .tag { font-size: clamp(18px,2.6vw,23px); line-height: 1.4; margin: 14px 0 0; max-width: 34em; color: #4a3a2a; }
  #plain .tag b { color: #b4501f; }
  #plain h2 { font-size: 30px; font-weight: 700; margin: 52px 0 14px; padding: 0 0 8px; border-bottom: 3px solid #3f7f84; display: inline-block; letter-spacing: .01em; }
  #plain p, #plain li { line-height: 1.6; font-size: 17px; }
  #plain a { color: #9a3f14; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  #plain a:hover { color: #6e2a0a; }
  #plain .wins { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 30px; }
  #plain .win { position: relative; padding: 16px 18px 16px 22px; background: #fff7e6; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px rgba(90,50,20,.12); }
  #plain .win::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; border-radius: 10px 0 0 10px; background: linear-gradient(180deg, #e8833f, #b4501f); }
  #plain .win small { display: block; font: 700 13px "Dosis",sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #b4501f; }
  #plain .win strong { display: block; font: 700 26px/1.1 "Dosis",sans-serif; margin: 4px 0 6px; }
  #plain .win span { font-size: 15px; line-height: 1.45; color: #4a3a2a; }
  #plain .cert { display: flex; gap: 16px; align-items: center; margin: 22px 0 0; padding: 12px; background: #fff7e6; border: 1px solid var(--line); border-radius: 10px; }
  #plain .cert button { flex: none; padding: 0; border: 6px solid #2b2118; background: #2b2118; cursor: zoom-in; box-shadow: 0 6px 16px rgba(60,30,10,.3); }
  #plain .cert img { display: block; width: 150px; height: auto; }
  #plain .cert p { margin: 0; font-size: 15px; color: #4a3a2a; }
  #plain .skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; padding: 0; margin: 0; list-style: none; }
  #plain .skills li { padding: 12px 14px; background: rgba(255,247,230,.7); border: 1px solid var(--line); border-radius: 8px; font-size: 15px; line-height: 1.45; }
  #plain .skills b { display: flex; align-items: center; gap: 8px; font: 700 19px "Dosis",sans-serif; margin-bottom: 2px; }
  #plain .skills i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
  #plain .proj { background: #fff7e6; border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin: 0 0 12px; box-shadow: 0 4px 14px rgba(90,50,20,.08); }
  #plain .proj.main { border-color: #b4501f; }
  #plain .proj h3 { margin: 0 0 4px; font-size: 26px; font-weight: 700; }
  #plain .proj .award { display: inline-block; margin: 0 0 6px; padding: 3px 10px; border-radius: 999px; background: #b4501f; color: #fff7e6; font: 700 14px "Dosis",sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  #plain .proj .stack { font-size: 14px; color: var(--soft); }
  #plain .proj p { margin: 6px 0; }
  @media (max-width: 560px) { #plain .cert { flex-direction: column; align-items: flex-start; } #plain .cert img { width: 100%; max-width: 260px; } }

  /* ---- PS2-menu look for the page buttons: rounded glass-blue plates with a soft glow, Dosis lettering (SIL OFL, credited in the footer) ---- */
  @font-face { font-family: "Dosis"; src: url("assets/fonts/Dosis.ttf") format("truetype"); font-weight: 200 800; font-display: swap; }
  :root { --ps2-a: rgba(74,102,196,.92); --ps2-b: rgba(22,30,86,.94); --ps2-edge: rgba(168,196,255,.6); --ps2-glow: rgba(96,140,255,.38); }
  #plainBtn, #soundBtn, #stepBack, #certClose, #hint.start, .gbbtns button {
    font-family: "Dosis","Trebuchet MS",sans-serif; font-weight: 700; font-size: 17px; letter-spacing: .1em; text-transform: uppercase; color: #f2f5ff;
    border: 1px solid var(--ps2-edge); border-radius: 12px; background: linear-gradient(180deg, var(--ps2-a), var(--ps2-b));
    box-shadow: 0 0 14px var(--ps2-glow), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -8px 14px rgba(8,10,40,.35); text-shadow: 0 1px 2px rgba(0,0,0,.55);
    transition: box-shadow .15s ease, transform .15s ease, filter .15s ease;
  }
  #plainBtn:hover, #soundBtn:hover, #stepBack:hover, #certClose:hover, #hint.start:hover, .gbbtns button:hover { background: linear-gradient(180deg, #5f82e6, #2a3a9a); box-shadow: 0 0 22px rgba(120,164,255,.65), inset 0 1px 0 rgba(255,255,255,.45); }
  #plainBtn:hover, #soundBtn:hover, #stepBack:hover, #certClose:hover, .gbbtns button:hover { transform: translateY(-1px); }   /* not on #hint: it is centred with transform, so overriding it made the button jump sideways under the cursor */
  #plainBtn:active, #soundBtn:active, #stepBack:active, #certClose:active { transform: translateY(1px); filter: brightness(.92); }
  #soundBtn[aria-pressed=true] { border-color: #9fe6ff; box-shadow: 0 0 18px rgba(100,220,255,.5), inset 0 1px 0 rgba(255,255,255,.4); }
  #soundBtn[aria-pressed=false] { filter: saturate(.45) brightness(.85); }
  .navarrow { width: 58px; height: 58px; border-radius: 16px; border: 1px solid var(--ps2-edge); background: linear-gradient(180deg, var(--ps2-a), var(--ps2-b)); color: #f2f5ff; box-shadow: 0 0 14px var(--ps2-glow), inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 0 1px 2px rgba(0,0,0,.55); }
  .navarrow:not(:disabled):hover { background: linear-gradient(180deg, #5f82e6, #2a3a9a); box-shadow: 0 0 22px rgba(120,164,255,.65); }
  #hint { font-family: "Dosis","Trebuchet MS",sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .08em; border-radius: 12px; border: 1px solid var(--ps2-edge); background: linear-gradient(180deg, rgba(40,56,128,.82), rgba(14,20,64,.86)); box-shadow: 0 0 12px var(--ps2-glow); color: #f2f5ff; }
  .brand { font-family: "Dosis","Trebuchet MS",sans-serif; font-weight: 700; letter-spacing: .06em; text-shadow: 0 0 12px var(--ps2-glow); }
</style>
</head>
<body class="warming">
<canvas id="gl" tabindex="0" role="application" aria-label="Interactive 3D console and TV. Click an item on the TV, or use the arrow keys, Enter and Escape. A plain version is available with the button at the top right."></canvas>
<div class="film"></div>

<div class="top">
  <span class="brand">Matías</span>
  <div class="topbtns"><button id="soundBtn" type="button" aria-pressed="true">Sound: on</button><button id="plainBtn" type="button" aria-pressed="false">Plain version</button></div>
</div>
<button id="hint" class="hud" type="button">Loading…</button>
<button id="stepBack" class="hud" type="button" hidden>‹ Step back</button>
<button id="arrL" class="navarrow hud" type="button" aria-label="Previous item" hidden>‹</button><button id="arrR" class="navarrow hud" type="button" aria-label="Next item" hidden>›</button>

<dialog id="certDlg" aria-label="Certificate">
  <figure style="margin:0"><img src="assets/props/certificate.jpg" alt="Certificate: first place in the Social Impact category, Rally Latinoamericano de Innovación 2026, team Helix, USS site in Chile, 20 October 2026" width="1100" height="850">
  <figcaption>First place, Social Impact category, with team Helix (USS site, Chile). Rally Latinoamericano de Innovación 2026, 16-17 October, held in 11 countries.</figcaption></figure>
  <button type="button" id="certClose">Close</button>
</dialog>
<dialog id="gbDlg" aria-labelledby="gbT">
  <form id="gbForm" method="dialog" novalidate>
    <h2 id="gbT">New save</h2>
    <p>Leave your name and a short message on the memory card. No links, please, and keep it friendly. Messages are reviewed before they appear, and are deleted after 60 days.</p>
    <label>Name or nickname <input type="text" name="name" maxlength="20" autocomplete="nickname" required></label>
    <label>Message <textarea name="message" maxlength="140" rows="3" required></textarea><span id="gbCount" aria-hidden="true">0 / 140</span></label>
    <fieldset><legend>Icon colour</legend><div class="gbswatches" id="gbSw"></div></fieldset>
    <div class="gbhp" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
    <p id="gbErr" role="alert"></p>
    <div class="gbbtns"><button type="button" id="gbCancel">Cancel</button><button type="submit" id="gbSend">Save</button></div>
  </form>
</dialog>
<main id="plain" aria-label="Plain version"></main>
<footer id="foot"><details id="creditsBox" open><summary>Credits &amp; licences</summary><span id="credits"></span></details></footer>
<div class="sr" id="live" aria-live="polite"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
// GLTFLoader / DRACOLoader / KTX2Loader are imported lazily (see loadGLB) so a CDN hiccup cannot break the page.

/* ================= editable: credits + model config ================= */
const CREDITS = {
  // Filled from the glTF asset.extras of the model actually loaded (see creditsFromExtras). Placeholders only if a model has no metadata.
  ps2: { title: '[PS2 model title]', author: '[author]', authorUrl: '', license: '[license]', licenseUrl: '', url: '', changes: '' },
  tv:  { title: '[TV model title]', author: '[author]', authorUrl: '', license: '[license]', licenseUrl: '', url: '', changes: '' },   // only shown if a TV model is loaded
};
function creditsFromExtras(ex, changes) {

function makeDisc(p) {
  const g = new THREE.Group();
  const s = new THREE.Shape(); s.absarc(0, 0, .06, 0, 6.2832); const h = new THREE.Path(); h.absarc(0, 0, .007, 0, 6.2832, true); s.holes.push(h);
  const geo = new THREE.ExtrudeGeometry(s, { depth: .0012, bevelEnabled: false, curveSegments: 40 }).rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xcdd1d9, metalness: .95, roughness: .22, envMapIntensity: 1.1 }));
  m.castShadow = true; g.add(m);
  const lt = canvasTex(256, 256, (c, w, hh) => {
    const gr = c.createLinearGradient(0, 0, w, hh); gr.addColorStop(0, p.c1); gr.addColorStop(1, p.c2);
    c.fillStyle = gr; c.beginPath(); c.arc(128, 128, 128, 0, 6.29); c.fill();
    c.fillStyle = 'rgba(30,38,56,.85)'; c.fillRect(40, 38, 176, 34); c.fillStyle = '#e6e3dc'; c.font = '700 22px Arial'; c.textAlign = 'center'; c.fillText(p.name.toUpperCase(), 128, 62);
    c.fillStyle = 'rgba(30,38,56,.7)'; c.font = '700 14px Arial'; c.fillText('PLACEHOLDER', 128, 224);
  });
  const lab = new THREE.Mesh(new THREE.RingGeometry(.013, .042, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: lt, roughness: .7, envMapIntensity: .4 }));
  lab.position.y = .0014; g.add(lab); g.userData.mats = [m.material, lab.material];
  return g;
}

function wrap(c, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { c.fillText(line, x, y); y += lh; line = w; } else line = t; }
  c.fillText(line, x, y); return y + lh;
