<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mock · Despacho de tarde (barra A + paneles + lupa)</title>
<style>
  :root { --ink:#2a1d10; --paper:#f4ead4; --amber:#ffc66b; --amber-d:#b5701b; --red:#9b2c1c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0805; overflow: hidden; }
  body { font-family: "Courier New", ui-monospace, monospace; color: var(--paper); }
  button, input, textarea { font-family: inherit; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #scene { width: 100%; height: 100%; display: block; transition: filter .3s; }
  body.panel-open #scene { filter: brightness(.45) saturate(.8); }

  .hs { fill: transparent; stroke: transparent; stroke-width: 3; cursor: pointer; pointer-events: all; transition: fill .2s, stroke .2s; }
  .hs:hover, .hs:focus-visible, .hs.pulse { fill: rgba(255,198,107,.16); stroke: rgba(255,214,150,.95); outline: none; filter: drop-shadow(0 0 14px rgba(255,198,107,.9)); }
  .hs.prop { pointer-events: none; } body.lens-on .hs.prop { pointer-events: all; }
  .dot { fill: rgba(255,214,150,.95); pointer-events: none; animation: ping 2.2s ease-in-out infinite; }
  .ring { fill: none; stroke: rgba(255,214,150,.9); stroke-width: 3; pointer-events: none; transform-box: fill-box; transform-origin: center; animation: ring 2.2s ease-out infinite; }
  @keyframes ping { 0%,100% { opacity: .9; } 50% { opacity: .55; } }
  @keyframes ring { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }
  .tag { pointer-events: none; } .tag rect { fill: var(--paper); stroke: #2a1d10; stroke-width: 2; }
  .tag text { fill: var(--ink); font-size: 25px; letter-spacing: 4px; text-transform: uppercase; font-family: "Courier New", monospace; }
  .tag line { stroke: var(--paper); stroke-width: 3; }
  body.panel-open .tag, body.panel-open .dot, body.panel-open .ring { opacity: 0; }

  /* barra superior fija (A) */
  #bar { position: fixed; left: 0; right: 0; top: 0; z-index: 12; display: flex; align-items: center; gap: 18px; padding: max(10px, env(safe-area-inset-top)) 16px 10px; background: linear-gradient(to bottom, rgba(12,8,4,.9), rgba(12,8,4,0)); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
  .brand { white-space: nowrap; } .brand b { color: var(--amber); font-weight: normal; }
  #nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  #nav button { background: transparent; border: 0; color: var(--paper); padding: 8px 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  #nav button.mobonly { display: none; }
  #nav button:hover, #nav button:focus-visible, #nav button.cur, #nav button.on { border-color: var(--amber); outline: none; }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 rgba(255,198,107,0); } 50% { box-shadow: 0 0 14px rgba(255,198,107,.7); } }

  #hint { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; z-index: 9; pointer-events: none; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; text-shadow: 0 1px 10px #000; }
  #hint span { color: var(--amber); } #hint { transition: opacity .6s; } #hint.gone { opacity: 0; }
  body.panel-open #hint { opacity: 0; }

  /* lupa activa */
  #lens { position: fixed; z-index: 25; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 6px solid #b78a3c; box-shadow: 0 0 0 3px #5a3d12, 0 8px 24px rgba(0,0,0,.55), inset 0 0 30px rgba(255,214,150,.35); background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.25), rgba(255,214,150,.07) 60%); pointer-events: none; display: none; }
  body.lens-on #lens { display: block; } body.lens-on #scene * { cursor: none !important; } body.lens-on.panel-open #lens { display: none; }
  #read { position: fixed; z-index: 26; pointer-events: none; display: none; background: var(--paper); color: var(--ink); padding: 10px 14px 12px; border: 2px solid var(--ink); box-shadow: 0 10px 28px rgba(0,0,0,.55); font-size: 12px; min-width: 190px; transform: rotate(-1deg); }
  #read.on { display: block; } #read small { display: block; letter-spacing: .2em; text-transform: uppercase; font-size: 10px; color: var(--red); }
  #read b { display: block; font-size: 15px; letter-spacing: .06em; margin: 3px 0 5px; } #read .ln { font-size: 13px; padding: 3px 0; border-bottom: 1px dotted rgba(42,29,16,.35); } #read .smp { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; opacity: .45; margin-top: 6px; }
  #read .bar { height: 7px; background: rgba(42,29,16,.18); margin-top: 6px; } #read .bar i { display: block; height: 100%; background: var(--amber-d); }

  /* panel */
  #veil { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 64px 14px 14px; }
  #veil.on { display: flex; }
  #panel { position: relative; width: min(820px, 100%); max-height: calc(100vh - 80px); overflow: auto; background: var(--paper); color: var(--ink); padding: 28px 32px 26px; box-shadow: 0 30px 80px rgba(0,0,0,.7); font-size: 15px; line-height: 1.65; border-top: 6px solid var(--amber-d); animation: pop .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { transform: translateY(22px); opacity: 0; } }
  #panel h2 { font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
  #panel h1 { font-size: 26px; line-height: 1.2; margin-bottom: 12px; font-weight: bold; }
  #panel .x { position: absolute; right: 12px; top: 12px; width: 34px; height: 34px; border: 1px solid var(--ink); background: transparent; font-size: 16px; cursor: pointer; color: var(--ink); }
  #panel p + p { margin-top: 10px; }
  #panel .btn { display: inline-block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; padding: 11px 15px; background: var(--ink); color: var(--paper); border: 0; cursor: pointer; text-decoration: none; margin: 14px 8px 0 0; }
  #panel .btn.alt { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .chip { display: inline-block; font-size: 11px; letter-spacing: .06em; padding: 3px 8px; border: 1px solid rgba(42,29,16,.5); margin: 0 5px 5px 0; background: rgba(255,255,255,.4); }
  .group { margin-top: 14px; } .group h3 { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 7px; opacity: .7; }
  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 8px; }
  .card { border: 1px solid rgba(42,29,16,.45); background: rgba(255,255,255,.4); display: flex; flex-direction: column; }
  .card .img { height: 96px; display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: .14em; color: rgba(42,29,16,.55); background: repeating-linear-gradient(45deg, #e5d6b3 0 10px, #ecdfc0 10px 20px); border-bottom: 1px solid rgba(42,29,16,.3); text-transform: uppercase; }
  .card .body { padding: 11px 13px 13px; font-size: 13px; } .card h4 { font-size: 15px; margin-bottom: 4px; }
  .win { display: inline-block; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; background: var(--red); color: #fff; padding: 2px 7px; margin-left: 6px; vertical-align: 2px; }
  .card .links { margin-top: 8px; font-size: 12px; } .card .links a { color: var(--red); margin-right: 10px; }
  .meta { font-size: 11px; opacity: .6; margin-top: 12px; }
  #panel input, #panel textarea { width: 100%; font-size: 14px; padding: 10px 11px; margin-bottom: 9px; background: rgba(255,255,255,.6); border: 1px solid rgba(42,29,16,.5); color: var(--ink); }
  /* mapa de conexiones (Skills) */
  .cmap { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 0 clamp(60px, 18%, 150px); margin-top: 14px; }
  .cmap svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .cmap .str { fill: none; stroke: var(--red); stroke-width: 1.6; opacity: .3; transition: opacity .15s, stroke-width .15s; }
  .cmap.has-on .str { opacity: .06; } .cmap.has-on .str.on { opacity: .95; stroke-width: 2.6; }
  .cmap .pin { fill: var(--red); opacity: .45; } .cmap .pin.on { opacity: 1; }
  .cmap .col { position: relative; z-index: 1; display: flex; flex-direction: column; }
  .cmap .col.skills { gap: 3px; } .cmap .col.projs { justify-content: space-between; }
  .cmap h3 { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; opacity: .7; margin: 12px 0 4px; } .cmap h3:first-child { margin-top: 0; }
  .cmap .sk, .cmap .pj { font: inherit; text-align: left; cursor: pointer; border: 1px solid rgba(42,29,16,.45); background: rgba(255,255,255,.5); color: var(--ink); }
  .cmap .sk { font-size: 13px; padding: 4px 10px; width: fit-content; }
  .cmap .pj { padding: 10px 12px; font-size: 12px; line-height: 1.35; } .cmap .pj b { display: block; font-size: 14px; }
  .cmap .sk.on, .cmap .pj.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .cmap.has-on .sk:not(.on):not(.rel), .cmap.has-on .pj:not(.on):not(.rel) { opacity: .4; }
  .cmap .sk.rel, .cmap .pj.rel { border-color: var(--red); background: rgba(255,255,255,.85); }
  .cmap button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  /* movimiento ambiental */
  .puff { transform-box: fill-box; transform-origin: center; opacity: 0; animation: rise 6s ease-out infinite; }
  @keyframes rise { 0% { transform: translate(0,0) scale(.35); opacity: 0; } 14% { opacity: .9; } 100% { transform: translate(var(--dx), -230px) scale(2.4); opacity: 0; } }
  .mote { animation: drift ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(0,0); opacity: .1; } 50% { opacity: .85; } to { transform: translate(var(--dx), var(--dy)); opacity: .15; } }
  #lampglow { animation: lampflick 4.2s ease-in-out infinite; mix-blend-mode: screen; pointer-events: none; }
  @keyframes lampflick { 0%,100% { opacity: .55; } 38% { opacity: .42; } 46% { opacity: .62; } 72% { opacity: .48; } }
  .reel { animation: spin 9s linear infinite; }
  body.tape-on .reel { animation-duration: 1.4s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .thread { fill: none; stroke: rgba(255,246,228,.75); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 70 260; animation: wisp 5.5s ease-in-out infinite; }
  @keyframes wisp { 0% { stroke-dashoffset: 70; opacity: 0; } 15% { opacity: .85; } 100% { stroke-dashoffset: -260; opacity: 0; } }
  .sway { animation: sway 5s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
  #cloud { mix-blend-mode: multiply; animation: cloud 26s ease-in-out infinite alternate; }
  @keyframes cloud { from { transform: translateX(-900px); } to { transform: translateX(700px); } }
  #sunbreath { mix-blend-mode: screen; animation: breathe 7s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .25; } 50% { opacity: .75; } }
  #sceneM { display: none; }
  #read .rx { display: none; }
  @media (max-width: 760px) {
    #bar { gap: 8px; } #bar .brand { display: none; } #nav button { padding: 8px 8px; letter-spacing: .1em; }
    #stage { overflow-y: auto; padding-top: 48px; background: #0b0805; }
    #scene { display: none; }
    #sceneM { display: block; width: 100%; height: auto; margin: 0 auto; max-height: calc(100dvh - 48px); transition: filter .3s; }
    body.panel-open #sceneM { filter: brightness(.45) saturate(.8); }
    #sceneM .tag text { font-size: 58px; letter-spacing: 9px; } #sceneM .tag rect { stroke-width: 6; } #sceneM .tag line { stroke-width: 8; }
    #sceneM .hs { stroke-width: 8; } #sceneM .ring { stroke-width: 7; }
    #lens { display: none !important; }
    #nav button.mobonly { display: block; }
    #hint .more { display: none; } #hint { bottom: 16px; font-size: 11px; }
    .thread, #cloud { display: none; } .sway { animation: none; }
    #read { left: 0 !important; right: 0; top: auto !important; bottom: 0; transform: none; border-width: 2px 0 0; padding: 16px 52px 20px 16px; font-size: 14px; pointer-events: auto; z-index: 40; }
    #read .rx { display: block; position: absolute; right: 8px; top: 8px; width: 38px; height: 38px; background: transparent; border: 1px solid var(--ink); color: var(--ink); font-size: 16px; cursor: pointer; }
    #veil { padding-top: 60px; } #panel { padding: 22px 18px; max-height: calc(100vh - 76px); } .cards { grid-template-columns: 1fr; }
    .cmap { gap: 0 44px; } .cmap .pj { padding: 8px 8px; font-size: 11px; } .cmap .pj b { font-size: 12px; } .cmap .pj span { display: none; } .cmap .sk { font-size: 12px; padding: 3px 7px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div id="stage"><svg id="scene" viewBox="0 0 2000 1116" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Detective office with interactive objects">
  <image href="assets/despacho-tarde.webp" x="0" y="0" width="2000" height="1116"/>
  <g id="spots"></g>
</svg></div>

<div id="bar">
  <div class="brand"><b>◆</b> Matías Rodriguez</div>
  <nav id="nav" aria-label="Sections"></nav>
</div>
<div id="hint"><span id="hintmain">Pick up the magnifier on the desk to inspect the objects</span> <span class="more">· or use the menu above · press play on the tape</span></div>

<div id="lens"></div>
<div id="read"></div>
<div id="veil" role="dialog" aria-modal="true"><div id="panel"><button class="x" id="close" aria-label="Close">✕</button><div id="content"></div></div></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const NS = 'http://www.w3.org/2000/svg';
  const body = document.body;

  // coordenadas sobre la ilustración 2000×1116 (despacho-tarde.webp)
  const SPOTS = [
    { id: 'skills',   label: 'Skills',   nav: true,  pts: '50,12 398,162 398,581 50,619',                        c: [225, 380],  tag: [225, 300] },
    { id: 'about',    label: 'About',    nav: true,  pts: '927,625 1138,625 1132,725 930,725',                   c: [1030, 676], tag: [1030, 585] },
    { id: 'contact',  label: 'Contact',  nav: true,  pts: '1285,635 1462,635 1462,740 1285,740',                 c: [1372, 688], tag: [1372, 595] },
    { id: 'projects', label: 'Projects', nav: true,  pts: '1616,431 1937,425 1937,1056 1616,1050',               c: [1776, 740], tag: [1776, 640] },
    { id: 'plaque',   label: 'Winner',   nav: false, pts: '1559,150 1770,150 1770,295 1559,295',                 c: [1664, 222], tag: [1664, 335] },
    { id: 'lens',     label: 'Magnifier',nav: false, pts: '310,1110 480,1015 668,978 672,1040 500,1062 340,1113', c: [490, 1040], tag: [490, 940] },
    { id: 'tape',     label: 'Play',     nav: false, pts: '225,600 400,600 400,825 225,825',                     c: [312, 735],  tag: [312, 862] },
  ];
  // fichas de evidencia (datos del design doc; textos de maqueta)
  const SCAN = {
    projects: { ex: 'Exhibit A', name: 'Projects cabinet', lines: ['4 cases on file · 673 commits', '2 public repos, 2 private', 'Latest win: AWS Zero to Shipped'] },
    skills:   { ex: 'Exhibit B', name: 'Connections board', lines: ['1,785 contributions in 12 months', 'Steady since May 2026', 'Busiest: Jun–Sep, 300+ a month'] },
    plaque:   { ex: 'Exhibit C', name: 'Winner plaque', lines: ['AWS Zero to Shipped · 1 of 5', 'Rumbo a Casa · 205 commits'] },
    about:    { ex: 'Exhibit D', name: 'Typewriter', lines: ['March 2026: 17 contributions', 'July 2026: 408 contributions'] },
    books:    { ex: 'Exhibit F', name: 'Books', lines: ['Reads Camus and Dostoevsky'] },
    poster:   { ex: 'Exhibit G', name: 'Film poster', lines: ['Mafia cinema, the Al Pacino kind'] },
    contact:  { ex: 'Exhibit E', name: 'Telephone', lines: ['Form → API Gateway + Lambda + SES', 'Replies by email'] },
  };

  if (location.hash.includes('tape')) body.classList.add('tape-on');
  const spots = $('#spots'), nav = $('#nav');

  /* ---------- movimiento sobre la ilustración (capas SVG bajo los hotspots) ---------- */
  const fx = document.createElementNS(NS, 'g'); fx.setAttribute('pointer-events', 'none'); $('#scene').insertBefore(fx, spots);
  const el = (n, a = {}, p = fx) => { const e = document.createElementNS(NS, n); Object.entries(a).forEach(([k, v]) => e.setAttribute(k, v)); p.appendChild(e); return e; };
  const defs = el('defs');
  const puffg = el('radialGradient', { id: 'puffg' }, defs); el('stop', { offset: 0, 'stop-color': '#fff', 'stop-opacity': .95 }, puffg); el('stop', { offset: 1, 'stop-color': '#fff', 'stop-opacity': 0 }, puffg);
  const glowg = el('radialGradient', { id: 'glowg' }, defs); el('stop', { offset: 0, 'stop-color': '#ffe2a0', 'stop-opacity': .8 }, glowg); el('stop', { offset: .5, 'stop-color': '#ffb347', 'stop-opacity': .25 }, glowg); el('stop', { offset: 1, 'stop-color': '#ff9a2a', 'stop-opacity': 0 }, glowg);
  // brillo de la lámpara
  el('circle', { id: 'lampglow', cx: 685, cy: 600, r: 190, fill: 'url(#glowg)' });
  // luz que respira en la ventana + sombra de nube que cruza el cuarto
  const sunq = el('linearGradient', { id: 'sung', x1: 0, y1: 0, x2: 0, y2: 1 }, defs); el('stop', { offset: 0, 'stop-color': '#ffd38a', 'stop-opacity': .55 }, sunq); el('stop', { offset: 1, 'stop-color': '#ffb15a', 'stop-opacity': 0 }, sunq);
  el('rect', { id: 'sunbreath', x: 590, y: 100, width: 890, height: 520, fill: 'url(#sung)' });
  const cg = el('linearGradient', { id: 'cloudg', x1: 0, y1: 0, x2: 1, y2: 0 }, defs); el('stop', { offset: 0, 'stop-color': '#fff', 'stop-opacity': 1 }, cg); el('stop', { offset: .5, 'stop-color': '#9a8f86', 'stop-opacity': 1 }, cg); el('stop', { offset: 1, 'stop-color': '#fff', 'stop-opacity': 1 }, cg);
  el('rect', { id: 'cloud', x: 900, y: 0, width: 1100, height: 1116, fill: 'url(#cloudg)', opacity: .9 });
  // bonsái: se recorta el follaje y se mece desde la maceta
  const bc = el('clipPath', { id: 'bonclip' }, defs); el('polygon', { points: '1686,352 1700,300 1742,272 1792,260 1842,288 1880,330 1872,352 1832,362 1802,382 1790,394 1758,380 1720,366' }, bc);
  const bo = el('g', { 'clip-path': 'url(#bonclip)' }); const bs = el('g', { class: 'sway' }, bo); bs.style.transformOrigin = '1790px 394px';
  el('image', { href: 'assets/despacho-tarde.webp', x: 0, y: 0, width: 2000, height: 1116 }, bs);
  // carretes de la grabadora: se recorta cada carrete (elipse por la perspectiva), se estira a círculo, se gira y se vuelve a comprimir
  [[330, 664, 23, 50], [381, 653, 19.5, 47]].forEach(([cx, cy, rx, ry], i) => {
    const k = rx / ry;
    const cp = el('clipPath', { id: 'reelclip' + i }, defs); el('ellipse', { cx, cy, rx, ry }, cp);
    const outer = el('g', { 'clip-path': `url(#reelclip${i})` });
    const sq = el('g', { transform: `translate(${cx} ${cy}) scale(${k} 1)` }, outer);
    const rot = el('g', { class: 'reel' }, sq);
    const un = el('g', { transform: `scale(${1 / k} 1) translate(${-cx} ${-cy})` }, rot);
    el('image', { href: 'assets/despacho-tarde.webp', x: 0, y: 0, width: 2000, height: 1116 }, un);
  });
  // humo del cigarrillo: hilos finos que ondulan
  const sf = el('filter', { id: 'blur2', x: '-50%', y: '-10%', width: '200%', height: '120%' }, defs); el('feGaussianBlur', { stdDeviation: 1.6 }, sf);
  [[862, 0, 1], [858, 1.9, -1], [866, 3.6, 1]].forEach(([x, d, f]) => {
    const t = el('path', { class: 'thread', d: `M0 0 C ${12 * f} -34, ${-16 * f} -70, ${6 * f} -110 S ${-14 * f} -170, ${8 * f} -230`, transform: `translate(${x} 696)`, filter: 'url(#blur2)' });
    t.style.animationDelay = d + 's'; t.style.animationDuration = (5 + Math.random() * 1.5).toFixed(1) + 's';
  });
  // polvo en los rayos de sol
  for (let i = 0; i < (innerWidth <= 760 ? 12 : 30); i++) {
    const m = el('circle', { class: 'mote', cx: 300 + Math.random() * 1450, cy: 200 + Math.random() * 760, r: (1 + Math.random() * 1.8).toFixed(1), fill: 'rgba(255,226,165,.9)' });
    m.style.setProperty('--dx', (Math.random() * 70 - 35).toFixed(0) + 'px'); m.style.setProperty('--dy', (Math.random() * 70 - 45).toFixed(0) + 'px');
    m.style.animationDuration = (6 + Math.random() * 8).toFixed(1) + 's'; m.style.animationDelay = (-Math.random() * 10).toFixed(1) + 's';
  }
  const renderSpot = (s, parent, k = 1, withNav = true) => {
    s.c = s.c || [0, 0]; s.tag = s.tag || [0, 0];
    const g = document.createElementNS(NS, 'g');
    const poly = document.createElementNS(NS, 'polygon');
    poly.setAttribute('points', s.pts); poly.setAttribute('class', 'hs'); poly.setAttribute('tabindex', '0'); poly.setAttribute('role', 'button'); poly.setAttribute('aria-label', s.label); poly.dataset.id = s.id;
    const ring = document.createElementNS(NS, 'circle'); ring.setAttribute('class', 'ring'); ring.setAttribute('cx', s.c[0]); ring.setAttribute('cy', s.c[1]); ring.setAttribute('r', 14 * k);
    const dot = document.createElementNS(NS, 'circle'); dot.setAttribute('class', 'dot'); dot.setAttribute('cx', s.c[0]); dot.setAttribute('cy', s.c[1]); dot.setAttribute('r', 8 * k);
    const w = (s.label.length * 18 + 34) * k, h = 44 * k;
    const tag = document.createElementNS(NS, 'g'); tag.setAttribute('class', 'tag');
    const ln = document.createElementNS(NS, 'line'); const below = s.tag[1] > s.c[1]; ln.setAttribute('x1', s.tag[0]); ln.setAttribute('y1', s.tag[1] + (below ? -h : h) / 2); ln.setAttribute('x2', s.c[0]); ln.setAttribute('y2', s.c[1] + (below ? 14 : -14) * k);
