<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mock · La sala</title>
<style>
  :root { --ink:#1b140c; --paper:#efe7d3; --amber:#ffc66b; --red:#c0392b; --teal:#16363b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #07090d; overflow: hidden; }
  body { font-family: "Courier New", ui-monospace, monospace; color: var(--paper); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #world { transition: transform .25s ease-out; transform-origin: 1000px 558px; }

  /* luces y partículas */
  .flick { animation: flick 3.4s ease-in-out infinite; }
  @keyframes flick { 0%,100% { opacity: .9 } 42% { opacity: .78 } 47% { opacity: .95 } 70% { opacity: .84 } }
  .rain line { stroke: rgba(190,215,235,.55); stroke-width: 1.4; animation: fall linear infinite; }
  @keyframes fall { from { transform: translate(0,-260px); } to { transform: translate(-40px, 520px); } }
  .dust circle { fill: rgba(255,214,150,.85); animation: drift ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(0,0); opacity: .15 } 50% { opacity: .85 } to { transform: translate(var(--dx), var(--dy)); opacity: .2 } }

  /* hotspots */
  .hs { fill: transparent; stroke: transparent; stroke-width: 3; cursor: pointer; pointer-events: all; transition: fill .2s, stroke .2s; }
  .hs:hover, .hs:focus-visible { fill: rgba(255,198,107,.14); stroke: rgba(255,214,150,.95); outline: none; filter: drop-shadow(0 0 14px rgba(255,198,107,.9)); }
  .dot { fill: rgba(255,214,150,.95); pointer-events: none; transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite; }
  .ring { fill: none; stroke: rgba(255,214,150,.9); stroke-width: 3; pointer-events: none; transform-box: fill-box; transform-origin: center; animation: ring 2.2s ease-out infinite; }
  @keyframes ping { 0%,100% { opacity: .9; } 50% { opacity: .55; } }
  @keyframes ring { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }
  .found .dot, .found .ring { display: none; }

  #tip { position: fixed; z-index: 20; pointer-events: none; padding: 7px 11px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
         background: var(--paper); box-shadow: 0 6px 18px rgba(0,0,0,.5); opacity: 0; transform: translate(-50%, -140%); transition: opacity .15s; white-space: nowrap; }
  #tip.on { opacity: 1; }

  /* HUD */
  #hud { position: fixed; left: 14px; top: max(14px, env(safe-area-inset-top)); z-index: 10; padding: 10px 14px; background: rgba(10,12,18,.62); border: 1px solid rgba(239,231,211,.25);
         backdrop-filter: blur(6px); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
  #hud .row { display: flex; gap: 5px; margin-top: 8px; }
  #hud .row i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(239,231,211,.5); }
  #hud .row i.on { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 8px var(--amber); }
  #caption { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); text-align: center; z-index: 10; pointer-events: none; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; text-shadow: 0 1px 8px #000; padding: 0 16px; }
  #caption span { color: var(--amber); }
  #title { position: fixed; right: 16px; top: max(14px, env(safe-area-inset-top)); z-index: 10; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; text-shadow: 0 1px 6px #000; }
  #title b { color: var(--amber); font-weight: normal; }

  /* panel */
  #veil { position: fixed; inset: 0; z-index: 30; background: rgba(4,6,10,.72); display: none; align-items: center; justify-content: center; padding: 14px; }
  #veil.on { display: flex; }
  #panel { position: relative; width: min(760px, 100%); max-height: calc(100vh - 28px); overflow: auto; background: var(--paper); color: var(--ink); padding: 26px 28px 24px;
           box-shadow: 0 30px 80px rgba(0,0,0,.7); transform: rotate(-.4deg); animation: pop .35s cubic-bezier(.2,.8,.2,1); font-size: 14px; line-height: 1.6;
           background-image: repeating-linear-gradient(transparent 0 27px, rgba(70,50,20,.07) 27px 28px); }
  @keyframes pop { from { transform: translateY(24px) rotate(-2deg) scale(.96); opacity: 0; } to { transform: rotate(-.4deg); opacity: 1; } }
  #panel h2 { font-size: 14px; letter-spacing: .22em; text-transform: uppercase; border-bottom: 2px solid var(--ink); padding-bottom: 9px; margin-bottom: 14px; padding-right: 36px; }
  #panel .x { position: absolute; right: 12px; top: 10px; width: 32px; height: 32px; border: 1px solid var(--ink); background: transparent; font: inherit; font-size: 16px; cursor: pointer; color: var(--ink); }
  #panel .hand { font-family: "Segoe Print","Bradley Hand","Comic Sans MS",cursive; color: #7a1f14; font-size: 13px; }
  #panel .small { font-size: 11px; opacity: .6; margin-top: 12px; }
  #panel button.btn { font: inherit; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; padding: 10px 14px; background: var(--ink); color: var(--paper); border: 0; cursor: pointer; margin-top: 12px; }
  #panel button.btn:hover { background: #3a2a14; }
  #panel input, #panel textarea { width: 100%; font: inherit; font-size: 13px; padding: 9px 10px; background: rgba(255,255,255,.55); border: 1px solid rgba(27,20,12,.5); margin-bottom: 8px; color: var(--ink); }

  /* calendario */
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 170px; margin: 10px 0 4px; }
  .bars div { flex: 1; background: linear-gradient(#c0392b, #7a1f14); position: relative; min-height: 3px; transform-origin: bottom; animation: grow .8s cubic-bezier(.2,.8,.2,1) backwards; }
  .bars div span { position: absolute; top: -17px; left: 0; right: 0; text-align: center; font-size: 10px; }
  .bars div.may { background: linear-gradient(#e0a43c, #9a6a14); }
  @keyframes grow { from { transform: scaleY(0); } }
  .lab { display: flex; gap: 8px; font-size: 10px; letter-spacing: .1em; text-align: center; } .lab span { flex: 1; }

  /* archivador */
  .drawer { border: 1px solid rgba(27,20,12,.5); margin-bottom: 8px; background: rgba(255,255,255,.35); }
  .drawer button { width: 100%; text-align: left; font: inherit; font-size: 13px; padding: 10px 12px; background: transparent; border: 0; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; color: var(--ink); }
  .drawer button:hover { background: rgba(192,57,43,.1); }
  .drawer .body { display: none; padding: 4px 12px 12px; font-size: 13px; }
  .drawer.open .body { display: block; }
  .chip { font-size: 10px; letter-spacing: .08em; padding: 2px 7px; border: 1px solid rgba(27,20,12,.5); margin-right: 4px; }

  /* máquina */
  .q { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px; padding: 9px 12px; margin-bottom: 7px; background: #2f4a3f; color: var(--paper); border: 0; cursor: pointer; }
  .q.on { background: #3f6757; }
  .sheet { margin-top: 10px; padding: 12px 14px; min-height: 96px; background: #fffdf5; border: 1px dashed rgba(27,20,12,.4); }
  .caret { display: inline-block; width: 7px; height: 14px; background: var(--ink); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* tablero (juego) */
  .game { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 120px; position: relative; margin: 10px 0; }
  .game button { font: inherit; font-size: 13px; padding: 10px 12px; border: 1px solid rgba(27,20,12,.55); background: #e7d9b4; cursor: pointer; text-align: center; color: var(--ink); transition: transform .15s, background .2s; position: relative; z-index: 2; }
  .game button.sel { background: #f0c35a; transform: scale(1.04); }
  .game button.ok { background: #bfe0a8; border-color: #3d7a2a; }
  .game button.bad { animation: shake .35s; background: #f2b4aa; }
  @keyframes shake { 20% { transform: translateX(-6px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(4px) } }
  .game svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .game svg line { stroke: #c0392b; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(240,195,90,.9)); animation: draw .5s ease-out; }
  @keyframes draw { from { opacity: 0; } }

  /* caja fuerte */
  .lock { display: flex; gap: 10px; justify-content: center; margin: 14px 0; }
  .lock b { width: 54px; height: 64px; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 28px; background: rgba(255,255,255,.5); }

  /* apagar luces */
  #lights { position: fixed; inset: 0; z-index: 4; background: #02040a; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  body.off #lights { opacity: .72; }
  @media (max-width: 640px) { #caption { bottom: max(70px, env(safe-area-inset-bottom)); font-size: 11px; } #title { display: none; } .game { gap: 10px 60px; } }
  @media (prefers-reduced-motion: reduce) { .rain, .dust, .dot, .ring, .flick { animation: none !important; } #world { transition: none; } }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 2000 1116" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Despacho de detective con objetos interactivos">
  <defs>
    <radialGradient id="lampg" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd58a" stop-opacity=".75"/><stop offset=".45" stop-color="#ffb347" stop-opacity=".25"/><stop offset="1" stop-color="#ff9a2a" stop-opacity="0"/></radialGradient>
    <radialGradient id="beam" gradientUnits="userSpaceOnUse" cx="1000" cy="560" r="760"><stop offset="0" stop-color="#05070c" stop-opacity="0"/><stop offset=".5" stop-color="#05070c" stop-opacity=".2"/><stop offset="1" stop-color="#05070c" stop-opacity=".62"/></radialGradient>
    <clipPath id="glass"><rect x="895" y="292" width="318" height="400"/><rect x="1250" y="410" width="300" height="285"/></clipPath>
  </defs>
  <g id="world">
    <image href="assets/despacho.webp" x="0" y="0" width="2000" height="1116"/>
    <g class="rain" clip-path="url(#glass)" id="rain"></g>
    <circle class="flick" cx="705" cy="590" r="300" fill="url(#lampg)" style="mix-blend-mode:screen"/>
    <g class="dust" id="dust"></g>
    <rect width="2000" height="1116" fill="url(#beam)" id="beamrect" pointer-events="none"/>
    <g id="spots"></g>
  </g>
</svg>
<div id="lights"></div>
<div id="tip"></div>

<div id="title"><b>◆</b> Agencia Matías · la sala</div>
<div id="hud"><div>Libreta · <span id="count">0</span>/7</div><div class="row" id="dots"></div></div>
<div id="caption">Mueve la linterna · <span>toca los objetos que brillan</span></div>

<div id="veil" role="dialog" aria-modal="true"><div id="panel"><button class="x" id="close" aria-label="Cerrar">✕</button><div id="content"></div></div></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const NS = 'http://www.w3.org/2000/svg';
  const scene = $('#scene'), world = $('#world'), tip = $('#tip'), veil = $('#veil'), content = $('#content');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Hotspots (coordenadas de la ilustración 2000×1116) ---------- */
  const SPOTS = [
    { id: 'tablero',   label: 'El tablero · conecta las pistas', pts: '38,6 655,214 648,655 42,872', c: [350, 330] },
    { id: 'calendario',label: 'Calendario · tu año',             pts: '770,675 868,670 872,742 778,744', c: [820, 708] },
    { id: 'lampara',   label: 'Lámpara · luz',                   pts: '615,512 802,512 800,572 752,640 750,760 645,760 650,642 640,572', c: [700, 600] },
    { id: 'maquina',   label: 'Máquina · interrogatorio',        pts: '922,598 1114,598 1112,752 926,752', c: [1018, 690] },
    { id: 'telefono',  label: 'Teléfono · llámame',              pts: '1172,642 1352,640 1352,742 1180,744', c: [1262, 690] },
    { id: 'archivador',label: 'Archivador · proyectos',          pts: '1686,398 2000,398 2000,1046 1690,1046', c: [1850, 640] },
    { id: 'caja',      label: 'Caja fuerte · secreto',           pts: '1522,768 1744,768 1744,1018 1522,1018', c: [1634, 892] },
    { id: 'ventana',   label: 'Ventana · la calle',              pts: '872,60 1580,60 1580,330 1210,330 1210,400 872,400', c: [1040, 190] },
  ];
  const found = new Set();
  const spots = $('#spots');
  SPOTS.forEach((s) => {
    const g = document.createElementNS(NS, 'g'); g.dataset.id = s.id;
    const poly = document.createElementNS(NS, 'polygon');
    poly.setAttribute('points', s.pts); poly.setAttribute('class', 'hs'); poly.setAttribute('tabindex', '0'); poly.setAttribute('role', 'button'); poly.setAttribute('aria-label', s.label);
    const ring = document.createElementNS(NS, 'circle'); ring.setAttribute('class', 'ring'); ring.setAttribute('cx', s.c[0]); ring.setAttribute('cy', s.c[1]); ring.setAttribute('r', 14);
    const dot = document.createElementNS(NS, 'circle'); dot.setAttribute('class', 'dot'); dot.setAttribute('cx', s.c[0]); dot.setAttribute('cy', s.c[1]); dot.setAttribute('r', 8);
    g.append(poly, ring, dot); spots.appendChild(g);
    poly.addEventListener('click', () => open(s.id));
    poly.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(s.id); } });
    poly.addEventListener('pointerenter', (e) => { tip.textContent = s.label; tip.classList.add('on'); moveTip(e); });
    poly.addEventListener('pointermove', moveTip);
    poly.addEventListener('pointerleave', () => tip.classList.remove('on'));
  });
  function moveTip(e) { tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; }

  // marcadores de progreso
  const dots = $('#dots'); SPOTS.slice(0, 7).forEach(() => dots.appendChild(document.createElement('i')));
  function markFound(id) {
    if (found.has(id)) return; found.add(id);
    document.querySelector(`#spots g[data-id="${id}"]`)?.classList.add('found');
    $('#count').textContent = Math.min(found.size, 7);
    [...dots.children].forEach((d, i) => d.classList.toggle('on', i < found.size));
  }

  /* ---------- Lluvia, polvo y linterna ---------- */
  const rain = $('#rain');
  for (let i = 0; i < (reduce ? 0 : 70); i++) {
    const l = document.createElementNS(NS, 'line'); const x = 880 + Math.random() * 700, y = 270 + Math.random() * 320, len = 14 + Math.random() * 22;
    l.setAttribute('x1', x); l.setAttribute('y1', y); l.setAttribute('x2', x - len * 0.16); l.setAttribute('y2', y + len);
    l.style.animationDuration = (0.9 + Math.random() * 0.9) + 's'; l.style.animationDelay = (-Math.random() * 2) + 's'; rain.appendChild(l);
  }
  const dust = $('#dust');
  for (let i = 0; i < (reduce ? 0 : 38); i++) {
    const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', 560 + Math.random() * 520); c.setAttribute('cy', 380 + Math.random() * 400); c.setAttribute('r', 1.2 + Math.random() * 2.2);
    c.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px'); c.style.setProperty('--dy', (-30 - Math.random() * 60) + 'px'); c.style.animationDuration = (4 + Math.random() * 6) + 's'; c.style.animationDelay = (-Math.random() * 8) + 's'; dust.appendChild(c);
  }
  const beam = $('#beam'); let target = { x: 1000, y: 560 }, cur = { x: 1000, y: 560 }, px = 0.5, py = 0.5;
  function toSvg(cx, cy) { const p = scene.createSVGPoint(); p.x = cx; p.y = cy; const m = scene.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : { x: 1000, y: 560 }; }
  addEventListener('pointermove', (e) => { const p = toSvg(e.clientX, e.clientY); target = { x: p.x, y: p.y }; px = e.clientX / innerWidth; py = e.clientY / innerHeight; }, { passive: true });
  function frame() {
    cur.x += (target.x - cur.x) * 0.1; cur.y += (target.y - cur.y) * 0.1;
    beam.setAttribute('cx', cur.x.toFixed(1)); beam.setAttribute('cy', cur.y.toFixed(1));
    world.style.transform = `translate(${((0.5 - px) * 26).toFixed(1)}px, ${((0.5 - py) * 14).toFixed(1)}px) scale(1.035)`;
    requestAnimationFrame(frame);
  }
  frame();

  /* ---------- Paneles ---------- */
  const MONTHS = [['Mar', 17], ['Abr', 9], ['May', 106], ['Jun', 382], ['Jul', 408], ['Ago', 404], ['Sep', 308], ['Oct*', 151]];
  const PROJECTS = [
    ['Rumbo a Casa', 'AWS Zero to Shipped · 1º lugar', 205, 'Hackathon de AWS. TypeScript.', 'https://github.com/BlasterLc/rumbo-a-casa'],
    ['DealJudge', 'Strands · Amazon Bedrock', 43, 'Un agente que juzga si un descuento es real: un modelo mide, Python decide y Bedrock redacta la alerta.', 'https://github.com/BlasterLc/dealjudge'],
    ['FitTrack', 'React Native · FastAPI · Supabase', 244, 'Seguimiento de gimnasio y nutrición para iOS, Android y web desde una sola base de código, con estimación de calorías por IA.', 'https://github.com/BlasterLc/fittrack'],
    ['Helix', 'Minimarkets chilenos', 70, 'Sistema de gestión para minimarkets. 1º lugar en Impacto Social, Rally de Innovación 2026 (sede USS). Repositorio privado.', null],
    ['JequeBot', 'Python · Discord', 154, 'Bot de música para Discord con YouTube y SoundCloud. Repositorio privado.', null],
    ['Alexa-PC', 'Alexa · Lambda · FastAPI', 57, 'Controla tu PC por voz con un Echo Dot. Repositorio privado.', null],
    ['Asistente', 'Next.js · React Native', 116, 'Un hilo donde sueltas lo que quieres hacer y un motor lo convierte en un horario realista. Repositorio privado.', null],
  ];
  const QA = [
    ['¿Qué te hizo empezar a construir?', 'En mayo sentí que tenía que tomar las riendas de mi futuro. Dejé de esperar y empecé con un bot de música.'],
    ['¿Qué fue lo más difícil de un proyecto?', '[borrador] Definir bien la arquitectura de Helix antes de seguir escribiendo código.'],
    ['¿Cómo aprendes algo nuevo?', '[borrador] Una tecnología a la vez, atada a un proyecto real.'],
  ];
  const PAIRS = { 'FitTrack': 'Supabase', 'DealJudge': 'Amazon Bedrock', 'Alexa-PC': 'AWS Lambda', 'JequeBot': 'Python', 'Rumbo a Casa': 'TypeScript' };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const VIEWS = {
    calendario() {
      const max = 410;
      return `<h2>Calendario · tu año en GitHub</h2>
        <div class="bars">${MONTHS.map(([m, v]) => `<div class="${m === 'May' ? 'may' : ''}" style="height:${Math.max(2, v / max * 100)}%"><span>${v}</span></div>`).join('')}</div>
        <div class="lab">${MONTHS.map(([m]) => `<span>${m}</span>`).join('')}</div>
        <p style="margin-top:16px"><span class="hand">mayo 2026:</span> de casi cero a unos 400 por mes, y se sostuvo. Empecé JequeBot y dejé de esperar.</p>
        <p class="small">Datos reales de tu calendario de contribuciones. 1.785 en el último año. *Octubre parcial.</p>`;
    },
    archivador() {
      return `<h2>Archivador · casos</h2>` + PROJECTS.map((p, i) => `<div class="drawer"><button type="button" aria-expanded="false"><span><b>${esc(p[0])}</b> · <span class="chip">${esc(p[1])}</span></span><span>${p[2]} commits ▾</span></button>
        <div class="body"><p>${esc(p[3])}</p><p class="hand" style="margin-top:8px">Lo que cambiaría hoy: [borrador, lo escribes tú]</p>${p[4] ? `<p class="small"><a href="${p[4]}" target="_blank" rel="noopener">ver repositorio ↗</a></p>` : '<p class="small">privado</p>'}</div></div>`).join('') +
        `<p class="small">Los cajones se abren con animación en la versión final.</p>`;
    },
    telefono() {
      return `<h2>Teléfono · llámame</h2><p>Marca y déjame un mensaje. <span class="hand">(cada mensaje llega por correo)</span></p>
        <input id="n" placeholder="Tu nombre" autocomplete="name"><input id="e" placeholder="Tu correo" type="email" autocomplete="email"><textarea id="m" rows="3" placeholder="¿En qué te ayudo?"></textarea>
        <button class="btn" id="send" type="button">☎ Marcar y enviar</button><p class="small" id="st">Mock: en la versión real el envío usa API Gateway, Lambda y SES.</p>`;
    },
    maquina() {
      return `<h2>Máquina · interrogatorio</h2>` + QA.map((q, i) => `<button class="q${i === 0 ? ' on' : ''}" data-k="${i}" type="button">${esc(q[0])}</button>`).join('') +
        `<div class="sheet"><div id="atext"></div><span class="caret"></span></div><p class="small">Pregunta libre con Amazon Bedrock: opcional, con tope de uso.</p>`;
    },
    tablero() {
      const projects = Object.keys(PAIRS), techs = [...Object.values(PAIRS)].sort(() => Math.random() - 0.5);
      return `<h2>Tablero · conecta las pistas</h2><p>Une cada proyecto con la tecnología que lo mueve. Si la conexión es real, el hilo se queda.</p>
        <div class="game" id="game"><svg id="gsv"></svg>${projects.map((p) => `<button data-p="${esc(p)}" type="button" style="grid-column:1">${esc(p)}</button>`).join('')}${techs.map((t, i) => `<button data-t="${esc(t)}" type="button" style="grid-column:2;grid-row:${i + 1}">${esc(t)}</button>`).join('')}</div>
        <p class="small" id="gst">Conexiones: 0/${projects.length} · ejemplo con datos de tus repos, confirma cada par.</p>`;
    },
    caja() {
      const need = 3, ok = found.size - (found.has('caja') ? 0 : 0);
      const have = [...found].filter((x) => x !== 'caja').length;
      if (have < need) return `<h2>Caja fuerte</h2><div class="lock"><b>?</b><b>?</b><b>?</b></div><p>La combinación se arma con lo que encuentres en la sala. <span class="hand">Pistas: ${have}/${need}</span></p>`;
      return `<h2>Caja fuerte · abierta</h2><div class="lock"><b>5</b><b>2</b><b>6</b></div><p class="hand">¡Combinación correcta! (mayo, 2026)</p><p>Aquí iría el secreto: certificaciones, una historia o un extra que no está en ningún otro lado.</p><p class="small">Contenido de ejemplo: confirma qué certificaciones ya tienes antes de publicarlas.</p>`;
    },
    ventana() {
      return `<h2>Ventana · la calle</h2><p>Afuera sigue lloviendo. Desde aquí se ve la calle por la que entraste.</p><a class="btn" href="index.html?grade=azul" style="display:inline-block;text-decoration:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;background:#1b140c;color:#efe7d3;margin-top:12px">← salir a la calle</a>`;
    },
  };

  const typer = { t: null };
  function open(id) {
    if (id === 'lampara') { document.body.classList.toggle('off'); markFound('lampara'); return; }
    markFound(id);
    content.innerHTML = VIEWS[id]();
    veil.classList.add('on'); $('#close').focus();
    if (id === 'archivador') content.querySelectorAll('.drawer button').forEach((b) => b.addEventListener('click', () => { const d = b.parentElement; d.classList.toggle('open'); b.setAttribute('aria-expanded', d.classList.contains('open')); }));
    if (id === 'maquina') { const ask = (k) => { content.querySelectorAll('.q').forEach((b, i) => b.classList.toggle('on', i === k)); const full = 'R: ' + QA[k][1], el = $('#atext'); el.textContent = ''; clearInterval(typer.t); let i = 0; typer.t = setInterval(() => { el.textContent = full.slice(0, ++i); if (i >= full.length) clearInterval(typer.t); }, 16); }; content.querySelectorAll('.q').forEach((b) => b.addEventListener('click', () => ask(+b.dataset.k))); ask(0); }
    if (id === 'telefono') { $('#send').addEventListener('click', () => { const st = $('#st'); st.textContent = '☎ marcando…'; setTimeout(() => st.textContent = '✔ Mensaje enviado (ejemplo). Gracias por llamar.', 900); }); }
    if (id === 'tablero') setupGame();
  }
  function close() { veil.classList.remove('on'); clearInterval(typer.t); }
  $('#close').addEventListener('click', close);
  veil.addEventListener('click', (e) => { if (e.target === veil) close(); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

  function setupGame() {
    const game = $('#game'), svg = $('#gsv'); let selP = null, done = 0;
    game.querySelectorAll('[data-p]').forEach((b) => b.addEventListener('click', () => { if (b.classList.contains('ok')) return; game.querySelectorAll('[data-p]').forEach((x) => x.classList.remove('sel')); selP = b; b.classList.add('sel'); }));
    game.querySelectorAll('[data-t]').forEach((t) => t.addEventListener('click', () => {
      if (!selP || t.classList.contains('ok')) return;
      if (PAIRS[selP.dataset.p] === t.dataset.t) {
        selP.classList.remove('sel'); selP.classList.add('ok'); t.classList.add('ok');
        const g = game.getBoundingClientRect(), a = selP.getBoundingClientRect(), b = t.getBoundingClientRect();
        const l = document.createElementNS(NS, 'line'); l.setAttribute('x1', a.right - g.left); l.setAttribute('y1', a.top + a.height / 2 - g.top); l.setAttribute('x2', b.left - g.left); l.setAttribute('y2', b.top + b.height / 2 - g.top); svg.appendChild(l);
        selP = null; done++; $('#gst').textContent = `Conexiones: ${done}/5` + (done === 5 ? ' · ¡caso resuelto! El tablero queda iluminado.' : '');
      } else { t.classList.add('bad'); setTimeout(() => t.classList.remove('bad'), 400); }
    }));
  }
})();
</script>
