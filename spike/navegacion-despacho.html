<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mock · Navegación del despacho (A / B / C)</title>
<style>
  :root { --ink:#1b140c; --paper:#efe7d3; --amber:#ffc66b; --red:#b3301f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #07090d; overflow: hidden; }
  body { font-family: "Courier New", ui-monospace, monospace; color: var(--paper); }
  button { font-family: inherit; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .hs { fill: transparent; stroke: transparent; stroke-width: 3; cursor: pointer; pointer-events: all; transition: fill .2s, stroke .2s; }
  .hs:hover, .hs:focus-visible, .hs.pulse { fill: rgba(255,198,107,.16); stroke: rgba(255,214,150,.95); outline: none; filter: drop-shadow(0 0 14px rgba(255,198,107,.9)); }
  .dot { fill: rgba(255,214,150,.95); pointer-events: none; animation: ping 2.2s ease-in-out infinite; }
  .ring { fill: none; stroke: rgba(255,214,150,.9); stroke-width: 3; pointer-events: none; transform-box: fill-box; transform-origin: center; animation: ring 2.2s ease-out infinite; }
  @keyframes ping { 0%,100% { opacity: .9; } 50% { opacity: .55; } }
  @keyframes ring { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }

  /* etiquetas sobre los objetos (A y C) */
  .tag { pointer-events: none; transition: opacity .2s; }
  .tag rect { fill: var(--paper); }
  .tag text { fill: var(--ink); font-size: 26px; letter-spacing: 4px; text-transform: uppercase; font-family: "Courier New", monospace; }
  .tag line { stroke: var(--paper); stroke-width: 3; }
  body:not(.m-a):not(.m-c) .tag { opacity: 0; }

  /* ---------- A · barra superior ---------- */
  #barA { display: none; position: fixed; left: 0; right: 0; top: 0; z-index: 12; align-items: center; gap: 18px; padding: 10px 16px; background: linear-gradient(to bottom, rgba(6,8,12,.9), rgba(6,8,12,0)); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
  body.m-a #barA { display: flex; }
  .brand { white-space: nowrap; } .brand b { color: var(--amber); font-weight: normal; }
  .links { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .links button { background: transparent; border: 0; color: var(--paper); padding: 8px 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .links button:hover, .links button:focus-visible { border-color: var(--amber); outline: none; }

  /* ---------- B · índice lateral ---------- */
  #sideB { display: none; position: fixed; left: 0; top: 0; bottom: 0; z-index: 12; width: 210px; padding: 26px 22px; flex-direction: column; background: linear-gradient(to right, rgba(6,8,12,.92), rgba(6,8,12,0)); }
  body.m-b #sideB { display: flex; }
  #sideB .brand { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 34px; }
  #sideB ol { list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 4px; }
  #sideB li button { width: 100%; text-align: left; background: transparent; border: 0; border-left: 2px solid rgba(239,231,211,.3); color: var(--paper); padding: 10px 12px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
  #sideB li button::before { counter-increment: s; content: "0" counter(s) "  "; color: var(--amber); }
  #sideB li button:hover, #sideB li button:focus-visible { border-color: var(--amber); background: rgba(255,198,107,.1); outline: none; }

  /* ---------- C · menú escondido ---------- */
  #menuBtn { display: none; position: fixed; right: 16px; top: 14px; z-index: 14; background: rgba(0,0,0,.55); border: 1px solid rgba(239,231,211,.5); color: var(--paper); padding: 9px 14px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; }
  body.m-c #menuBtn { display: block; }
  #menuC { display: none; position: fixed; right: 16px; top: 56px; z-index: 14; min-width: 200px; background: var(--paper); color: var(--ink); box-shadow: 0 16px 40px rgba(0,0,0,.6); }
  body.m-c.menu-open #menuC { display: block; }
  #menuC button { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid rgba(27,20,12,.2); padding: 12px 16px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; color: var(--ink); }
  #menuC button:hover { background: #e7d9b4; }
  #menuC button:last-child { border-bottom: 0; }

  /* hint común + toast de maqueta */
  #hint { position: fixed; left: 0; right: 0; bottom: 74px; text-align: center; z-index: 9; pointer-events: none; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; text-shadow: 0 1px 8px #000; }
  #hint span { color: var(--amber); }
  #toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; background: var(--paper); color: var(--ink); padding: 20px 26px; font-size: 13px; letter-spacing: .08em; box-shadow: 0 20px 60px rgba(0,0,0,.7); display: none; text-align: center; }
  #toast.on { display: block; } #toast small { display: block; margin-top: 6px; opacity: .6; font-size: 11px; }

  /* conmutador de la maqueta (no forma parte del sitio) */
  #switch { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 30; display: flex; gap: 0; background: #fff; color: #111; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.6); font-family: system-ui, sans-serif; }
  #switch button { border: 0; background: transparent; padding: 11px 16px; font-size: 13px; cursor: pointer; color: #111; font-family: inherit; }
  #switch button.on { background: #111; color: #fff; }
  #switch span { padding: 11px 12px; font-size: 11px; opacity: .55; align-self: center; }

  @media (max-width: 760px) {
    #barA .brand { display: none; }
    #sideB { width: 150px; padding: 70px 10px 10px; } #sideB .brand { display: none; }
    #hint { bottom: 80px; }
    #switch button { padding: 11px 12px; font-size: 12px; } #switch span { display: none; }
  }
</style>
</head>
<body class="m-a">
<svg id="scene" viewBox="0 0 2000 1116" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Despacho de detective con objetos interactivos">
  <image href="assets/despacho.webp" x="0" y="0" width="2000" height="1116"/>
  <g id="spots"></g>
</svg>

<!-- A -->
<div id="barA">
  <div class="brand"><b>◆</b> Matías Rodriguez</div>
  <nav class="links" aria-label="Secciones"></nav>
</div>
<!-- B -->
<aside id="sideB"><div class="brand"><b style="color:var(--amber)">◆</b> Matías<br>Rodriguez</div><ol></ol></aside>
<!-- C -->
<button id="menuBtn" type="button" aria-expanded="false">☰ Menú</button>
<div id="menuC"></div>

<div id="hint"></div>
<div id="toast"></div>

<div id="switch">
  <span>Mock:</span>
  <button data-m="a" class="on" type="button">A · Barra + etiquetas</button>
  <button data-m="b" type="button">B · Índice lateral</button>
  <button data-m="c" type="button">C · Solo etiquetas</button>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const NS = 'http://www.w3.org/2000/svg';
  const body = document.body;

  // coordenadas de la ilustración 2000×1116 (las mismas de despacho2.html)
  const SPOTS = [
    { id: 'about',    label: 'About',    pts: '922,598 1114,598 1112,752 926,752',       c: [1018, 690], tag: [1018, 570] },
    { id: 'skills',   label: 'Skills',   pts: '38,6 655,214 648,655 42,872',             c: [350, 330],  tag: [350, 250] },
    { id: 'projects', label: 'Projects', pts: '1686,398 2000,398 2000,1046 1690,1046',   c: [1850, 640], tag: [1850, 520] },
    { id: 'journey',  label: 'Journey',  pts: '770,675 868,670 872,742 778,744',         c: [820, 708],  tag: [820, 640] },
    { id: 'contact',  label: 'Contact',  pts: '1172,642 1352,640 1352,742 1180,744',     c: [1262, 690], tag: [1262, 612] },
  ];
  const DESC = { about: 'la carta (máquina de escribir)', skills: 'el tablero de corcho', projects: 'el archivador', journey: 'el calendario', contact: 'el teléfono' };

  const spots = $('#spots');
  SPOTS.forEach((s) => {
    const g = document.createElementNS(NS, 'g');
    const poly = document.createElementNS(NS, 'polygon');
    poly.setAttribute('points', s.pts); poly.setAttribute('class', 'hs'); poly.setAttribute('tabindex', '0'); poly.setAttribute('role', 'button'); poly.setAttribute('aria-label', s.label); poly.dataset.id = s.id;
    const ring = document.createElementNS(NS, 'circle'); ring.setAttribute('class', 'ring'); ring.setAttribute('cx', s.c[0]); ring.setAttribute('cy', s.c[1]); ring.setAttribute('r', 14);
    const dot = document.createElementNS(NS, 'circle'); dot.setAttribute('class', 'dot'); dot.setAttribute('cx', s.c[0]); dot.setAttribute('cy', s.c[1]); dot.setAttribute('r', 8);
    // etiqueta con ancho según el texto
    const w = s.label.length * 19 + 34, h = 46;
    const tag = document.createElementNS(NS, 'g'); tag.setAttribute('class', 'tag');
    const ln = document.createElementNS(NS, 'line'); ln.setAttribute('x1', s.tag[0]); ln.setAttribute('y1', s.tag[1] + h / 2); ln.setAttribute('x2', s.c[0]); ln.setAttribute('y2', s.c[1] - 14);
    const r = document.createElementNS(NS, 'rect'); r.setAttribute('x', s.tag[0] - w / 2); r.setAttribute('y', s.tag[1] - h / 2); r.setAttribute('width', w); r.setAttribute('height', h);
    const t = document.createElementNS(NS, 'text'); t.setAttribute('x', s.tag[0]); t.setAttribute('y', s.tag[1] + 9); t.setAttribute('text-anchor', 'middle'); t.textContent = s.label;
    tag.append(ln, r, t);
    g.append(poly, ring, dot, tag); spots.appendChild(g);
    poly.addEventListener('click', () => open(s.id));
    poly.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(s.id); } });
  });

  // menús (los tres leen la misma lista)
  const mk = (parent, wrap) => SPOTS.forEach((s) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = s.label; b.dataset.go = s.id;
    if (wrap) { const li = document.createElement('li'); li.appendChild(b); parent.appendChild(li); } else parent.appendChild(b);
    b.addEventListener('click', () => { pulse(s.id); open(s.id); body.classList.remove('menu-open'); });
  });
  mk($('#barA .links')); mk($('#sideB ol'), true); mk($('#menuC'));

  function pulse(id) { const p = document.querySelector(`.hs[data-id="${id}"]`); p.classList.add('pulse'); setTimeout(() => p.classList.remove('pulse'), 1200); }
  let tt;
  function open(id) {
    const s = SPOTS.find((x) => x.id === id), el = $('#toast');
    el.innerHTML = `Se abriría el panel <b>${s.label}</b><small>(${DESC[id]}) · en el sitio real es un panel sobre la escena</small>`;
    el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 1800);
  }

  $('#menuBtn').addEventListener('click', () => { const o = body.classList.toggle('menu-open'); $('#menuBtn').setAttribute('aria-expanded', o); });

  const HINTS = {
    a: 'Toca un objeto con etiqueta · o usa el menú de arriba',
    b: 'Toca los objetos que brillan · o usa el índice de la izquierda',
    c: 'Toca un objeto con etiqueta · o abre el menú',
  };
  function setMode(m) {
    body.classList.remove('m-a', 'm-b', 'm-c', 'menu-open'); body.classList.add('m-' + m);
    document.querySelectorAll('#switch button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
    $('#hint').innerHTML = HINTS[m].replace(/(Toca[^·]*|Toca los objetos que brillan)/, '<span>$1</span>');
    history.replaceState(null, '', '#' + m);
  }
  document.querySelectorAll('#switch button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.m)));
  setMode(['a', 'b', 'c'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'a');
})();
</script>
</body>
</html>
